[package]
name = "lanbeam-core"
version = "1.0.0"
edition = "2021"
description = "LANBeam native transfer engine: BLAKE3 + zstd + Merkle + QUIC + zero-copy I/O."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs: expose Rust functions to Node.js as an async native module.
napi = { version = "2", features = ["async", "tokio_rt", "napi8", "tokio_full"] }
napi-derive = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Hashing: BLAKE3 is multithreaded and several times faster than SHA-256
blake3 = "1"

# Compression: zstd level 1-3 for compressible chunks
zstd = { version = "0.13", features = ["zstdmt"] }

# QUIC transport — quinn gives us a mature async QUIC implementation
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"            # self-signed cert generation for LAN-only TLS
rustls-pemfile = "2"

# I/O
bytes = "1"
futures = "0.3"

# Misc
once_cell = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
