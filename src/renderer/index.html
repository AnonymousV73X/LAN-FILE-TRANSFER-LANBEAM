<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LANBeam — Fast. Local. Seamless.</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Instant Shell: stream the shell's critical font weights in parallel
       with CSS/JS parse instead of after first layout needs them. Combined
       with font-display:swap (styles.css) this removes the invisible-text
       window on cold-HDD boots. -->
  <link rel="preload" href="fonts/figtree-400.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="fonts/figtree-500.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="fonts/figtree-600.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="fonts/figtree-700.ttf" as="font" type="font/ttf" crossorigin />
  <script>
    /* Instant Shell anti-FOUC — apply the cached theme BEFORE first paint.
       Written by applyAccent/applyFont (renderer main.js) on every theme
       change; on first run / cleared storage this is a harmless no-op and
       the app boots in the default theme as before. Without this, the app
       painted default cyan and flipped to the user's theme only after the
       state:get IPC round-trip landed — very visible on slow disks. */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("lanbeam:theme") || "null");
        if (t && t.a) {
          var rs = document.documentElement.style;
          rs.setProperty("--accent-color", t.a);
          if (t.r) {
            rs.setProperty("--accent-rgb", t.r);
            rs.setProperty("--accent-soft", "rgba(" + t.r + ", 0.15)");
            rs.setProperty("--accent-very-soft", "rgba(" + t.r + ", 0.06)");
          }
          var FV = {
            figtree: "var(--font-figtree)",
            outfit: "var(--font-outfit)",
            system: "var(--font-system)",
          };
          if (t.fc && FV[t.fc]) rs.setProperty("--font-sans", FV[t.fc]);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="window">


    <!-- ===== Header row ===== -->

      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
        </svg>
        <span class="brand-word">LANBeam</span>
        <span class="brand-divider"></span>
        <span class="brand-tagline">Fast. Local. Seamless.</span>
      </div>
      <div class="header-right">
        <div class="status">
          
        </div>
      </div>
    </header>

    <!-- Custom Window Controls (NovaTune spec) -->

      <button class="win-btn" id="win-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><line x1="1.5" y1="6" x2="10.5" y2="6"/></svg></button>

    </div>

    <!-- ===== Body: sidebar + content ===== -->

      <!-- Sidebar -->
      <nav class="sidebar">

              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </button>
                    <button class="nav-item" data-view="explorer" aria-label="Explorer" data-tip="Explorer">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button class="nav-item" data-view="devices" aria-label="Devices" data-tip="Devices">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </button>
          <button class="nav-item" data-view="history" id="nav-history-btn" style="display:none" aria-label="History">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </button>
          <button class="nav-item" data-view="speedtest" aria-label="Speed Test" data-tip="Speed Test">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.54 19.79a9.25 9.25 0 1 0-13.08 0"></path>
              <path d="m12 13.25 4-4"></path>
            </svg>
          </button>
          <button class="nav-item" data-view="settings" aria-label="Settings" data-tip="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
        <div class="sidebar-bottom"></div>
      </nav>

      <!-- Main content -->
      <main class="content" id="content">
        <!-- Home view is rendered here -->
      </main>
    </div>





  <!-- Explorer view template -->
  <template id="view-explorer">
    <div class="explorer-container">
      <div class="explorer-header">
        <div class="explorer-devices-tabs" id="explorer-devices-bar">
          <!-- Dynamic storage device tabs -->
        </div>
        <div class="explorer-breadcrumbs-bar">
          <button id="explorer-up-btn" class="explorer-btn-icon" data-tip="Up Directory">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="explorer-breadcrumbs" id="explorer-breadcrumbs"></div>
          <div class="explorer-search-box">
            <span class="explorer-search-icon">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="explorer-search-input" placeholder="Search folder..." autocomplete="off" spellcheck="false" />
            <button id="explorer-search-scope-btn" class="explorer-scope-pill" data-tip="Toggle: Search Current Folder vs Whole Drive">In Folder</button>
            <button id="explorer-search-clear-btn" class="explorer-search-clear" data-tip="Clear search">✕</button>
          </div>
          <button id="explorer-refresh-btn" class="explorer-btn-icon" data-tip="Refresh">

            </svg>
          </button>
        </div>
      </div>
      <div class="explorer-body">
        <div class="explorer-table-header">
          <span class="col-check"></span>
          <span class="col-name">Name</span>
          <span class="col-size">Size</span>
          <span class="col-date">Modified</span>
        </div>
        <div class="explorer-list" id="explorer-list">
          <!-- Items will be populated here -->
        </div>
      </div>
    </div>
  </template>

  <!-- Templates for views (kept in DOM but swapped into .content) -->
  <template id="view-home">
    <!-- Top row: drop zone (70%) + QR panel (30%) -->
    <section class="top-row">
      <div class="dropzone" id="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h2 class="dropzone-title">Drop files here or click to browse</h2>
        <p class="dropzone-sub">Images, videos, documents, archives and more…</p>
        <input type="file" id="dropzone-input" multiple style="display:none" />
      </div>
      <div class="qr-panel">
        <div class="qr-frame" id="qr-frame" role="button" tabindex="0" aria-label="Enlarge QR code">
          <div id="qr-skeleton" class="skeleton-shimmer" style="position:absolute;inset:0;border-radius:inherit;z-index:0;min-height:100px"></div>
          <img id="qr-image" alt="" style="position:relative;z-index:1;display:none" />
          <span class="qr-tip" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="11" y1="8.5" x2="11" y2="13.5"/><line x1="8.5" y1="11" x2="13.5" y2="11"/></svg>
            <span>Click to enlarge</span>
          </span>
          <span class="qr-expand-chip" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="11" y1="8.5" x2="11" y2="13.5"/><line x1="8.5" y1="11" x2="13.5" y2="11"/></svg>
          </span>
        </div>
        <p class="qr-caption">Scan to pair with your phone · click the code to enlarge</p>
        <div class="qr-url-row">
          <input type="text" id="qr-url-text" readonly class="qr-url-input" aria-label="Pairing link" />
          <button id="qr-copy-btn" class="qr-copy-btn" aria-label="Copy pairing link">Copy</button>
        </div>
        <p class="qr-alt-url" id="qr-alt-url" hidden></p>
      </div>
    </section>

    <!-- Connected devices -->
    <section class="devices-section">
      <div class="section-header">
        <h3>Connected Devices</h3>
        <div class="section-meta">
          <span class="status-dot status-dot-online"></span>
          <span id="device-count">0 devices online</span>
        </div>
      </div>
      <div class="device-cards" id="device-cards"><div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);margin-bottom:8px"><div class="skeleton-shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div><div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);margin-bottom:8px"><div class="skeleton-shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div></div>
    </section>

    <!-- Active transfer cards container (supports multiple parallel/sequential cards) -->
    <section class="transfer-section" id="transfer-section" style="display:none"></section>
  </template>

  <template id="view-devices">
    <section class="page">
      <div class="page-head-row">
        <div>
          <h2 class="page-title">Devices</h2>
          <p class="page-sub">Paired devices on this LAN. Click a device to send files.</p>
        </div>
        <button type="button" class="ghost-btn" id="clear-offline-btn" data-tip="Remove every offline device from the list">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Clear offline</span>
        </button>
      </div>
      <div class="device-cards" id="device-cards-page"><div class="device-card" style="opacity:.5;pointer-events:none"><div class="device-icon skeleton-shimmer" style="width:40px;height:40px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px;margin-left:12px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div><div class="device-card" style="opacity:.5;pointer-events:none"><div class="device-icon skeleton-shimmer" style="width:40px;height:40px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px;margin-left:12px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div><div class="device-card" style="opacity:.5;pointer-events:none"><div class="device-icon skeleton-shimmer" style="width:40px;height:40px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px;margin-left:12px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div></div>
      <h3 class="page-subtitle">Discovered Peers</h3>
      <div class="device-cards" id="peer-cards-page"><div class="device-card" style="opacity:.5;pointer-events:none"><div class="device-icon skeleton-shimmer" style="width:40px;height:40px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px;margin-left:12px"><div class="skeleton-shimmer" style="height:13px;width:50%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:35%;border-radius:4px"></div></div></div></div>
    </section>
  </template>

  <template id="view-history">
    <section class="page">
      <h2 class="page-title">History</h2>
      <p class="page-sub">Recent transfers with throughput and integrity.</p>
      <div class="history-list" id="history-list"><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div class="skeleton-shimmer" style="width:36px;height:36px;border-radius:8px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:65%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:40%;border-radius:4px"></div></div><div class="skeleton-shimmer" style="width:60px;height:22px;border-radius:12px"></div></div><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div class="skeleton-shimmer" style="width:36px;height:36px;border-radius:8px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:65%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:40%;border-radius:4px"></div></div><div class="skeleton-shimmer" style="width:60px;height:22px;border-radius:12px"></div></div><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div class="skeleton-shimmer" style="width:36px;height:36px;border-radius:8px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:65%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:40%;border-radius:4px"></div></div><div class="skeleton-shimmer" style="width:60px;height:22px;border-radius:12px"></div></div><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div class="skeleton-shimmer" style="width:36px;height:36px;border-radius:8px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:65%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:40%;border-radius:4px"></div></div><div class="skeleton-shimmer" style="width:60px;height:22px;border-radius:12px"></div></div><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div class="skeleton-shimmer" style="width:36px;height:36px;border-radius:8px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="skeleton-shimmer" style="height:13px;width:65%;border-radius:4px"></div><div class="skeleton-shimmer" style="height:10px;width:40%;border-radius:4px"></div></div><div class="skeleton-shimmer" style="width:60px;height:22px;border-radius:12px"></div></div></div>
    </section>
  </template>

  <template id="view-speedtest">
    <section class="page">
      <h2 class="page-title">Speed Test</h2>
      <p class="page-sub">Measure the transfer engine and your real Wi-Fi link.</p>

      <h3 class="page-subtitle">Transfer engine (this PC)</h3>
      <p class="st-note">Pushes 32MB of incompressible data through the real LAN server stack — first as a single stream (the small-file path), then as 6 parallel lanes. Large PC→phone sends now use the multi-lane path, so this is the ceiling your PC pushes before Wi-Fi even gets involved.</p>
      <button class="bench-btn" id="st-run">Run engine test</button>
      <div class="bench-results" id="st-results"></div>

      <h3 class="page-subtitle">Real Wi-Fi speed (PC → phone)</h3>
      <p class="st-note">Open LANBeam on your phone on the same Wi-Fi and tap “Speed test” in the footer — the phone measures the true over-the-air receive rate, single stream vs up to 12 parallel lanes across two addresses of this PC: exactly the paths PC→phone sends use (small files stream, files ≥8MB go multi-lane).</p>
    </section>
  </template>

  <template id="view-settings">
    <section class="page">
      <h2 class="page-title">Settings</h2>
      <p class="page-sub">Tune the transfer engine and theme.</p>
      <div class="settings-grid">
        <label class="setting">
          <span class="setting-label">Chunk size (MB)</span>
          <input type="range" min="1" max="16" step="1" id="setting-chunk" />
          <span class="setting-value" id="setting-chunk-val">4</span>
          <span class="setting-hint" style="font-size: 11px; opacity: 0.6; margin-top: 4px;">4 MB is recommended for lowest latency & memory.</span>
        </label>
        <label class="setting">
          <span class="setting-label">Max parallel streams</span>
          <input type="range" min="1" max="32" step="1" id="setting-streams" />
          <span class="setting-value" id="setting-streams-val">4</span>
          <span class="setting-hint" style="font-size: 11px; opacity: 0.6; margin-top: 4px;">4 streams is the sweet spot for Wi-Fi & hotspot stability.</span>
        </label>
        <div class="setting">
          <span class="setting-label">Compression</span>
          <div class="custom-dropdown" id="dropdown-compression" data-value="auto">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">Auto (entropy-based)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item selected" data-value="auto">Auto (entropy-based)</div>
              <div class="dropdown-item" data-value="on">Always on</div>
              <div class="dropdown-item" data-value="off">Always off</div>
            </div>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Font</span>
          <div class="custom-dropdown" id="dropdown-font" data-value="figtree">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">Figtree (Default)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item selected" data-value="figtree">Figtree (Default)</div>
              <div class="dropdown-item" data-value="outfit">Outfit</div>
              <div class="dropdown-item" data-value="system">System Default</div>
            </div>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">UI scale (4K / 2K panels)</span>
          <div class="custom-dropdown" id="dropdown-uiscale" data-value="auto">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">Auto (recommended)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item selected" data-value="auto">Auto (recommended)</div>
              <div class="dropdown-item" data-value="1.0">100%</div>
              <div class="dropdown-item" data-value="1.25">125%</div>
              <div class="dropdown-item" data-value="1.5">150%</div>
              <div class="dropdown-item" data-value="1.75">175%</div>
              <div class="dropdown-item" data-value="2.0">200%</div>
            </div>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Receiving</span>
          <div class="custom-dropdown" id="dropdown-receive" data-value="auto">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">Auto-receive (instant)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item selected" data-value="auto">Auto-receive (instant)</div>
              <div class="dropdown-item" data-value="ask">Ask every time</div>
            </div>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Multi-file sending</span>
          <div class="custom-dropdown" id="dropdown-sendmode" data-value="sequential">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">Sequential (one by one)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item selected" data-value="sequential">Sequential (one by one)</div>
              <div class="dropdown-item" data-value="simultaneous">Simultaneous (parallel)</div>
            </div>
          </div>
        </div>
        <div class="setting" style="grid-column:1/-1">
          <span class="setting-label">Save received files to</span>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="text" id="setting-downloaddir" readonly style="flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border,rgba(255,255,255,.12));background:transparent;color:inherit;font:inherit;font-size:12px;text-overflow:ellipsis" />
            <button type="button" class="ghost-btn" id="setting-downloaddir-pick">Choose / create…</button>
            <button type="button" class="ghost-btn" id="setting-downloaddir-reset">Default</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Speed unit</span>
          <div class="custom-dropdown" id="dropdown-speed" data-value="mBps">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-selected">MB/s (Default)</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item" data-value="mbps">Mbps</div>
              <div class="dropdown-item selected" data-value="mBps">MB/s (Default)</div>
              <div class="dropdown-item" data-value="gBps">GB/s</div>
              <div class="dropdown-item" data-value="gbps">Gbps</div>
            </div>
          </div>
        </div>
        <label class="setting">
          <span class="setting-label">WiFi slow-link warning</span>
          <label class="custom-switch">
            <input type="checkbox" id="setting-warn" />
            <span class="switch-slider"></span>
          </label>
        </label>
        <label class="setting">
          <span class="setting-label">Show Transfer History tab</span>
          <label class="custom-switch">
            <input type="checkbox" id="setting-history" />
            <span class="switch-slider"></span>
          </label>
        </label>
      </div>
      <h3 class="page-subtitle">Accent color</h3>
      <div class="settings-swatches" id="settings-swatches">
        <button class="swatch active" data-color="#00E5FF" style="background:#00E5FF"></button>
        <button class="swatch" data-color="#8B5CF6" style="background:#8B5CF6"></button>
        <button class="swatch" data-color="#F59E0B" style="background:#F59E0B"></button>
        <button class="swatch" data-color="#EC4899" style="background:#EC4899"></button>
        <button class="swatch" data-color="#10B981" style="background:#10B981"></button>
      </div>
      <h3 class="page-subtitle">Benchmark</h3>
      <button class="bench-btn" id="bench-run">Run benchmark</button>
      <div class="bench-results" id="bench-results"></div>
    </section>
  </template>

  <script src="main.js"></script>
</body>
</html>
